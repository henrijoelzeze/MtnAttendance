name: Build, NuGet audit, and container vulnerability scan

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - fix/hr-ldap-first-login
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore and audit direct and transitive NuGet dependencies
        run: dotnet restore MtnAttendance.csproj

      - name: Report known vulnerable packages
        run: dotnet package list --project MtnAttendance.csproj --vulnerable --include-transitive --no-restore

      - name: Compile
        run: dotnet build MtnAttendance.csproj -c Release --no-restore

      - name: Build runtime Docker image
        run: docker build --pull --tag mtn-attendance:security .

      - name: Verify native Linux GSSAPI library exists in runtime image
        run: docker run --rm --entrypoint /bin/sh mtn-attendance:security -c 'find /usr/lib -name libgssapi_krb5.so.2 -print -quit | grep -q .'

      - name: Scan operating-system and library vulnerabilities in final image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: mtn-attendance:security
          scan-type: image
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: false
